name: CI/CD & Multi-App Integrity Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Multi-App Integrity & Conflict Audit
  code-integrity-audit:
    name: Conflict & Link Integrity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Git Merge Conflict Markers
        run: |
          echo "Scanning for unresolved conflict markers across all files..."
          if grep -rnw . -e '<<<<<<<' -e '=======' -e '>>>>>>>' \
            --exclude-dir={.git,.gradle,build,build_backups,node_modules,dist}; then
            echo "ERROR: Unresolved merge conflict markers detected in repository!"
            exit 1
          else
            echo "SUCCESS: Zero merge conflict markers found."
          fi

      - name: Validate Critical Configuration Files
        run: |
          test -f app/build.gradle.kts || { echo "Missing app/build.gradle.kts"; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "Missing AndroidManifest.xml"; exit 1; }
          test -f app/google-services.json || { echo "Missing google-services.json"; exit 1; }
          test -f admin-portal/package.json || { echo "Missing admin-portal/package.json"; exit 1; }
          echo "All critical config files verified."

  # 2. Android App Test & APK Assembly
  android-build-and-test:
    name: Android Build & APK Package
    needs: code-integrity-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DietaryOpsManager-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # 3. Super-Admin Web Dashboard (React + Vite)
  web-admin-portal-build:
    name: Admin Portal Web Build
    needs: code-integrity-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Admin Portal Dependencies
        working-directory: admin-portal
        run: npm install

      - name: Compile & Build Web Admin Portal
        working-directory: admin-portal
        run: npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-portal-dist
          path: admin-portal/dist/
          retention-days: 14
